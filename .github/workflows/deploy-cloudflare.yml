name: Deploy GLASSY STORE API to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
    inputs:
      apply_d1_migrations:
        description: "Apply production D1 migrations (requires Cloudflare Account > D1 > Edit; leave false for a Worker-only deploy)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: glassy-store-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check Worker
        run: npm run typecheck

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1)

      - name: Apply production D1 migrations (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_d1_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if ! npx wrangler d1 migrations apply yuss --remote; then
            echo "::error::D1 migration failed. For Cloudflare error 7403, verify that this token has Account > D1 > Edit permission and that CLOUDFLARE_ACCOUNT_ID belongs to the same Cloudflare account as database yuss. The Worker deploy is stopped to avoid deploying against an unmigrated database."
            exit 1
          fi

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
